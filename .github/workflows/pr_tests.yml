# Run test matrix on Pull Requests
#
# ==============================================================================
#
# The testing matrix considers ruby/puppet versions supported by SIMP:
# ------------------------------------------------------------------------------
# Release      Gem        Ruby
# OpenVox 8    openvox 8  3.2, 3.4
# OpenVox 9*   openvox 8  4.0     (*unreleased; previewed with the OpenVox 8 gem)
#
# https://voxpupuli.org/openvox/
# ==============================================================================
#
# https://docs.github.com/en/actions/reference/events-that-trigger-workflows
#

name: PR Tests
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  ruby-style:
    name: 'Ruby Style'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby 4.0'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: true
      - name: 'Run rubocop'
        run: |
          bundle show
          bundle exec rubocop

  releng-checks:
    name: 'RELENG checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby 4.0'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: true
      - run: 'command -v rpm || if command -v apt-get; then sudo apt-get update; sudo apt-get install -y rpm; fi ||:'
      - name: 'Tags and changelogs'
        run: |
          bundle exec rake pkg:check_version
          bundle exec rake pkg:compare_latest_tag
          bundle exec rake pkg:create_tag_changelog

  spec-tests:
    name: 'Spec'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        puppet:
          - label: 'OpenVox 8.x (Ruby 3.2)'
            puppet_version: '~> 8.0'
            ruby_version: '3.2'
            experimental: false
          - label: 'OpenVox 8.x (Ruby 3.4)'
            puppet_version: '~> 8.0'
            ruby_version: '3.4'
            experimental: false
          # OpenVox 9 is unreleased; preview the future Ruby 4.0 / OpenVox 9
          # combo by running the OpenVox 8 gem on Ruby 4.0.
          - label: 'OpenVox 9.x preview (Ruby 4.0, OpenVox 8 gem)'
            puppet_version: '~> 8.0'
            ruby_version: '4.0'
            experimental: false
      fail-fast: false
    env:
      PUPPET_VERSION: '${{matrix.puppet.puppet_version}}'
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby ${{matrix.puppet.ruby_version}}'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{matrix.puppet.ruby_version}}
          bundler-cache: true
      # The unpack_dvd unit tests need mkisofs, isoinfo, rpmbuild, and
      # createrepo_c to build and unpack a fixture ISO; without them, those
      # tests are silently skipped.  Ubuntu's genisoimage provides
      # mkisofs-compatible genisoimage and isoinfo binaries, but no mkisofs
      # name, so add a compatibility symlink.
      - name: 'Install ISO/RPM tooling for the unpack_dvd tests'
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage rpm createrepo-c
          command -v mkisofs || sudo ln -s "$(command -v genisoimage)" /usr/local/bin/mkisofs
      - run: 'bundle exec rake spec'
        continue-on-error: ${{matrix.puppet.experimental}}
